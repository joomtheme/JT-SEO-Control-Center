COM_JTSEO_CONFIG_ORGANIZATION_LOGO_LABEL="Kuruluş logosu"
COM_JTSEO_CONFIG_ORGANIZATION_LOGO_DESC="Organization veya LocalBusiness JSON-LD içinde kullanılan logo URL'si. Varsayılan Open Graph görseli tanımlı değilse standart og:image yedeği olarak da kullanılır. Standart dışı og:logo özelliği üretilmez."
COM_JTSEO_CONFIG_ORGANIZATION_EMAIL_LABEL="E-posta"
