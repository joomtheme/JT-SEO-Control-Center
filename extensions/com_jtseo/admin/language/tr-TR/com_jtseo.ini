COM_JTSEO_CONFIG_ENABLE_WEBPAGE_SCHEMA_LABEL="Makale dışı sayfalara WebPage şeması ekle"
COM_JTSEO_CONFIG_ENABLE_WEBPAGE_SCHEMA_DESC="SP Page Builder ve diğer sayfa oluşturucular dâhil bileşen sayfalarına son belge başlığı, açıklaması ve canonical URL kullanılarak genel WebPage yapılandırılmış verisi ekler."
COM_JTSEO_CONFIG_SCHEMA_SKIP_EXISTING_LABEL="Tekrarlanan şema türlerini önle"
COM_JTSEO_CONFIG_SCHEMA_SKIP_EXISTING_DESC="Joomla çekirdek Schema.org çıktısı varsa onu yerinde zenginleştirir. Diğer JSON-LD sağlayıcılarında eşleşen Article/WebPage varlıkları ve aynı @id değerleri tekrar eklenmez."
COM_JTSEO_CONFIG_HOMEPAGE_SCHEMA_TYPE_LABEL="Ana sayfa kuruluş türü"
COM_JTSEO_CONFIG_HOMEPAGE_SCHEMA_TYPE_DESC="Genel siteler için Organization, fiziksel veya yerel işletme temsil eden siteler için LocalBusiness seçin."
