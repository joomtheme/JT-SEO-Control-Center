COM_JTSEO_CONFIG_WEBSITE_NAME_LABEL="Web sitesi adı"
COM_JTSEO_CONFIG_WEBSITE_NAME_DESC="WebSite şeması ve og:site_name için kullanılan ad. Boşsa kuruluş adı kullanılır. Aşağıdan dile özel web sitesi adı tanımlanabilir."
COM_JTSEO_CONFIG_ORGANIZATION_ALTERNATE_NAME_LABEL="Alternatif ad"
